<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons / App icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link rel="shortcut icon" href="/icons/favicon-32.png" type="image/png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary metadata -->
    <title>Matha Chicken</title>
    <meta
      name="description"
      content="Matha Chicken — fresh chicken delivery platform."
    />
    <meta name="application-name" content="Matha Chicken" />
    <meta name="theme-color" content="#863bff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Matha Chicken" />
    <meta
      property="og:description"
      content="Matha Chicken — fresh chicken delivery platform."
    />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Matha Chicken" />
    <meta
      name="twitter:description"
      content="Matha Chicken — fresh chicken delivery platform."
    />
    <meta name="twitter:image" content="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
